name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit version changes, push tags, create GitHub releases
      pull-requests: write # open and update the release PR
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      # Token fallback until every package has a trusted publisher on npmjs.com.
      # pnpm tries OIDC first and only uses the token when the registry has no
      # trusted publisher for the package. The token is read from the
      # environment at publish time, never written to disk.
      - name: Setup npm auth
        run: |
          cat << 'EOF' > "$HOME/.npmrc"
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          EOF

      - name: Create Release PR or Publish to NPM
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm release
          commit-message: "chore: release"
          pr-title: "chore: release candidate"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
